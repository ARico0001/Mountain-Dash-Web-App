<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Dash - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .auth-dependent { display: none; }
    </style>
</head>
<body>
    <main id="logged-out-view" class="container my-5 auth-dependent">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4 border-0 rounded-3">
                    <h2 class="fw-bold text-center mb-1">Mountain Dash</h2>
                    <p class="text-muted text-center mb-4">Community Job Board &amp; Marketplace</p>
                    <h5 class="fw-semibold mb-3">Account Access</h5>
                    <form id="auth-form" class="d-flex flex-column gap-2 mb-3">
                        <input type="email" id="auth-email" class="form-control" placeholder="Your Email" required>
                        <input type="password" id="auth-password" class="form-control" placeholder="Your Password" required>
                        <div class="d-flex gap-2 mt-2">
                            <button type="submit" id="signin-email-btn" class="btn btn-primary fw-bold flex-grow-1">Sign In</button>
                            <button type="button" id="signup-email-btn" class="btn btn-success fw-bold flex-grow-1">Sign Up</button>
                        </div>
                    </form>
                    <div class="text-center my-2 text-muted small">OR</div>
                    <button id="login-btn" class="btn btn-outline-dark fw-bold w-100 d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-google text-danger"></i> Sign in with Google
                    </button>
                    <div id="auth-status" class="mt-3 text-center fw-semibold small"></div>
                    <a href="dashboard.html" class="text-center mt-3 small">Continue as guest</a>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const supabase = createClient(
            "https://hxrhnemlxptlcvpvmpwu.supabase.co",
            "sb_publishable_U24SEjua7BNgn5cJID6QLQ_ZuR1Q1Vt",
            { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
        );
        const authStatus = document.getElementById("auth-status");
        const authForm = document.getElementById("auth-form");

        function showStatus(message, className) {
            authStatus.textContent = message;
            authStatus.className = `mt-3 text-center fw-semibold small ${className}`;
        }

        function credentials() {
            return {
                email: document.getElementById("auth-email").value.trim(),
                password: document.getElementById("auth-password").value
            };
        }

        authForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const { email, password } = credentials();
            if (!email || !password) {
                showStatus("Please fill out both email and password fields.", "text-danger");
                return;
            }
            showStatus("Signing in...", "text-dark");
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                showStatus(`Sign-in error: ${error.message}`, "text-danger");
                return;
            }
            window.location.replace("dashboard.html");
        });

        document.getElementById("signup-email-btn").addEventListener("click", async () => {
            const { email, password } = credentials();
            if (!email || !password) {
                showStatus("Please fill out both email and password fields.", "text-danger");
                return;
            }
            showStatus("Creating account...", "text-dark");
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) {
                showStatus(`Sign-up error: ${error.message}`, "text-danger");
                return;
            }
            showStatus("Success! Check your email for a confirmation link.", "text-success");
            authForm.reset();
        });

        document.getElementById("login-btn").addEventListener("click", async () => {
            showStatus("Redirecting to Google...", "text-dark");
            const { error } = await supabase.auth.signInWithOAuth({
                provider: "google",
                options: { redirectTo: `${window.location.origin}/dashboard.html` }
            });
            if (error) showStatus(`Google error: ${error.message}`, "text-danger");
        });

        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            window.location.replace("dashboard.html");
        } else {
            document.getElementById("logged-out-view").classList.remove("auth-dependent");
        }
    </script>
</body>
</html>
